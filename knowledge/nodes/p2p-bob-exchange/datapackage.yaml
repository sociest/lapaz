name: p2p-bob-exchange
title: Mercado Cambiario P2P BOB / USDT (Binance Bolivia)
resources:
- name: advertiser
  type: table
  path: https://www.kaggle.com/datasets/andreschirinos/p2p-bob-exchange/advertiser.parquet
  scheme: file
  format: parquet
  mediatype: application/parquet
  schema:
    fields:
    - name: advertiser_userno
      type: string
      description: Identificador único anonimizado del comerciante
    - name: advertiser_nickname
      type: string
      description: Seudónimo del anunciante
    - name: advertiser_monthordercount
      type: number
      description: Órdenes ejecutadas en los últimos 30 días
    - name: advertiser_monthfinishrate
      type: number
      description: Tasa de cumplimiento de órdenes (%)
    - name: advertiser_positiverate
      type: number
      description: Porcentaje de comentarios positivos
    - name: advertiser_usertype
      type: string
      description: Tipo de comerciante (user, merchant)
    - name: advertiser_viplevel
      type: number
      description: Nivel VIP de la cuenta
    - name: timestamp
      type: datetime
      description: Momento de captura de la cotización
    - name: source
      type: string
      description: Plataforma de origen (Binance P2P)
- name: advice
  type: table
  path: https://www.kaggle.com/datasets/andreschirinos/p2p-bob-exchange/advice.parquet
  scheme: file
  format: parquet
  mediatype: application/parquet
  schema:
    fields:
    - name: advno
      type: string
      description: Identificador del anuncio
    - name: classify
      type: string
      description: Clasificación del anuncio
    - name: tradetype
      type: string
      description: Tipo de operación
    - name: asset
      type: string
      description: Activo negociado
    - name: fiatunit
      type: string
      description: Moneda fiduciaria de la operación
    - name: price
      type: number
      description: Precio del activo
    - name: surplusamount
      type: number
      description: Monto excedente disponible
    - name: tradablequantity
      type: number
      description: Cantidad negociable
    - name: maxsingletransamount
      type: number
      description: Monto máximo por transacción
    - name: minsingletransamount
      type: number
      description: Monto mínimo por transacción
    - name: paytimelimit
      type: number
      description: Límite de tiempo para el pago
    - name: trademethods
      type: string
      description: Métodos de pago aceptados
    - name: takeradditionalkycrequired
      type: boolean
      description: Indica si se requiere KYC adicional del comprador
    - name: assetscale
      type: number
      description: Escala decimal del activo
    - name: fiatscale
      type: number
      description: Escala decimal de la moneda fiduciaria
    - name: pricescale
      type: number
      description: Escala decimal del precio
    - name: fiatsymbol
      type: string
      description: Símbolo de la moneda fiduciaria
    - name: istradable
      type: boolean
      description: Indica si el anuncio está disponible para negociar
    - name: dynamicmaxsingletransamount
      type: number
      description: Monto máximo dinámico por transacción
    - name: minsingletransquantity
      type: number
      description: Cantidad mínima por transacción
    - name: maxsingletransquantity
      type: number
      description: Cantidad máxima por transacción
    - name: dynamicmaxsingletransquantity
      type: number
      description: Cantidad máxima dinámica por transacción
    - name: commissionrate
      type: number
      description: Tasa de comisión
    - name: issafepayment
      type: boolean
      description: Indica si el método de pago es seguro
    - name: advertiser_userno
      type: string
      description: Identificador único anonimizado del comerciante
    - name: timestamp
      type: datetime
      description: Momento de captura de la cotización
    - name: source
      type: string
      description: Plataforma de origen (Binance P2P)
