name: dolares
title: Tipos de Cambio en Bolivia (Mercado Paralelo, Bancos y BCB)
description: Series históricas y monitoreo continuo de tipos de cambio del dólar estadounidense (USD) y criptoactivos estables (USDT) frente al boliviano (BOB). Integra cotizaciones informales de alta frecuencia en Binance P2P (VWAP, naive, mediana y concentración HHI), tipos oficiales y referenciales del Banco Central de Bolivia (BCB), detalle de operaciones bancarias desagregadas y cotizaciones comerciales en ventanilla de bancos bolivianos.
homepage: https://github.com/mauforonda/dolares
spatial:
  country: BO
  granularity: national
temporal:
  start: "2005-06-01T00:00:00Z"
  end: "2026-10-12T23:59:59Z"
  frequency: irregular
quality:
  status: verified
  completeness: 0.99
sources:
  - title: Dólares en Bolivia (Repositorio GitHub mauforonda/dolares)
    path: https://github.com/mauforonda/dolares
  - title: Banco Central de Bolivia (BCB)
    path: https://www.bcb.gob.bo
  - title: Binance P2P API
    path: https://p2p.binance.com
contributors:
  - title: Mauricio Foronda
    role: author
    path: https://github.com/mauforonda
resources:
  - name: binance_compra
    title: Binance P2P - Cotización de Compra (USDT/BOB)
    type: table
    path: https://raw.githubusercontent.com/mauforonda/dolares/main/datos/binance/compra.csv
    scheme: file
    format: csv
    mediatype: text/csv
    encoding: utf-8
    policy: allow_all
    schema:
      fields:
        - name: timestamp
          type: datetime
          description: Fecha y hora de captura de la cotización (ISO 8601 con zona horaria de Bolivia)
        - name: low
          type: number
          description: Cotización mínima registrada en la muestra de ofertas de compra
        - name: high
          type: number
          description: Cotización máxima registrada en la muestra de ofertas de compra
        - name: median
          type: number
          description: Mediana de las ofertas de compra activas
        - name: vwap
          type: number
          description: Media ponderada por volumen (VWAP) de ofertas de compra (valor justo de mercado)
        - name: naive
          type: number
          description: Moda en el 10% extremo de ofertas de compra (valor efectivo de uso común)

  - name: binance_compra_mercado
